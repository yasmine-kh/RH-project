# Base en memoire : les tests ne dependent pas d'une MySQL lancee
spring.datasource.url=jdbc:h2:mem:talent360bank;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Comme en exploitation (voir src/main/resources/application.properties) : un
# acces LAZY hors transaction doit echouer dans les tests aussi.
spring.jpa.open-in-view=false

# Comme en exploitation : aucune page d'erreur ne montre de detail technique.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
