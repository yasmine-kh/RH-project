# Reglages de developpement : -Dspring-boot.run.profiles=dev.
# Jamais pour une demonstration client ni en exploitation.

# Requetes SQL dans la console
spring.jpa.show-sql=true

# Recharge automatique des templates sans redemarrer le serveur
spring.thymeleaf.cache=false

# Redemarrage automatique a chaque recompilation.
spring.devtools.restart.enabled=true
# LiveReload reste coupe : son serveur (port 35729) ecoute sur toutes les
# interfaces et DevTools ne permet pas de le limiter a 127.0.0.1.
spring.devtools.livereload.enabled=false
