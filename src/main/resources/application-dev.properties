# Reglages de developpement : -Dspring-boot.run.profiles=dev.
# Jamais pour une demonstration client ni en exploitation.

# Requetes SQL dans la console
spring.jpa.show-sql=true

# Recharge automatique des templates sans redemarrer le serveur
spring.thymeleaf.cache=false

# Pas de redemarrage automatique a chaque recompilation : il relance l'application en silence et
# perd toutes les sessions (formulaires refuses, "Votre session a expire"). Pour l'activer
# volontairement : lancer avec la propriete systeme spring.devtools.restart.enabled a true.
spring.devtools.restart.enabled=false
# LiveReload reste coupe : son serveur (port 35729) ecoute sur toutes les
# interfaces et DevTools ne permet pas de le limiter a 127.0.0.1.
spring.devtools.livereload.enabled=false
