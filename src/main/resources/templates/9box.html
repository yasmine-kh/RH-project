<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Talent 360 Bank - 9-Box</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar('9box')}"></div>

    <main class="main-content">
        <header class="page-header">
            <h1>Matrice 9-Box</h1>
            <p class="text-muted">Performance (bas -&gt; haut) x Potentiel (gauche -&gt; droite)</p>
        </header>

        <div class="ninebox-grid">
            <div class="ninebox-cell" th:each="cell : ${cells}">
                <div class="ninebox-cell-title" th:text="${cell.categorie}">Categorie</div>
                <div class="ninebox-cell-count" th:text="${cell.nombreCollaborateurs} + ' collaborateur(s)'">0</div>
                <ul class="ninebox-cell-list">
                    <li th:each="nom : ${cell.collaborateurs}" th:text="${nom}">Nom</li>
                </ul>
            </div>
        </div>
    </main>

</div>

</body>
</html>
