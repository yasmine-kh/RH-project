<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Talent 360 Bank - 9-Box</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar('9box')}"></div>

    <main class="main-content">
        <header class="page-header">
            <h1>Matrice 9-Box</h1>
            <p class="text-muted" th:if="${trimestre != null}"
               th:text="|Performance x Potentiel - ${trimestre.libelle}|">Performance x Potentiel</p>
        </header>

        <th:block th:if="${trimestre == null}"><div th:replace="~{fragments/commun :: aucunTrimestre}"></div></th:block>

        <form method="get" action="/9box" class="filtre-bar" th:if="${trimestre != null}">
            <div th:replace="~{fragments/commun :: choixTrimestre}"></div>
            <button type="submit" class="btn btn-primary"><i class="bi bi-funnel"></i> Afficher</button>
        </form>

        <div class="row g-4 mt-1" th:if="${trimestre != null}">
            <!-- La matrice (cases sans noms) ; une case ouvre son detail a droite. -->
            <section class="col-lg-7">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <div th:replace="~{fragments/matrice9box :: matrice(${matrice})}"></div>
                    </div>
                </div>
            </section>

            <!--
              Panneau de detail : un panneau par case, seul celui de la case ouverte est visible.
              Sans JavaScript, chaque case recharge la page sur ?case=N#detail ; neufbox.js bascule
              le panneau sur place, filtre et trie avec les donnees deja dans la page.
            -->
            <section class="col-lg-5" id="detail">
                <div class="card shadow-sm h-100 neufbox-detail">
                    <div class="card-body">
                        <div th:each="c : ${matrice.cases}" class="neufbox-panneau"
                             th:attr="data-case=${c.numero}" th:hidden="${c.numero != matrice.caseSelectionnee}">
                            <p class="text-muted small mb-1" th:text="|Case ${c.numero}|">Case 9</p>
                            <h2 class="h5 mb-1" th:text="${c.libelle}">Talent cle</h2>
                            <p class="text-muted small mb-2" th:text="${c.sens}">Performance elevee et potentiel eleve.</p>
                            <p class="mb-3"><span class="fs-4 fw-bold" th:text="${c.nombre}">10</span>
                                <span class="text-muted" th:text="|collaborateur(s)| + (${c.pourcentage != null} ? | - ${c.pourcentage} %| : '')">collaborateurs - 10 %</span></p>

                            <form method="get" action="/9box" class="neufbox-outils d-flex flex-wrap gap-2 mb-2">
                                <input type="hidden" name="trimestre" th:value="${trimestre.valeur}">
                                <input type="hidden" name="case" th:value="${c.numero}">
                                <input type="search" name="q" class="form-control form-control-sm neufbox-recherche"
                                       placeholder="Nom, matricule ou entité" th:value="${recherche}"
                                       th:attr="aria-label=|Rechercher dans ${c.libelle}|">
                                <select name="tri" class="form-select form-select-sm neufbox-tri" aria-label="Trier">
                                    <option value="NOM" th:selected="${tri == 'NOM'}">Nom</option>
                                    <option value="PERFORMANCE" th:selected="${tri == 'PERFORMANCE'}">Performance</option>
                                    <option value="POTENTIEL" th:selected="${tri == 'POTENTIEL'}">Potentiel</option>
                                </select>
                                <button type="submit" class="btn btn-sm btn-outline-primary">OK</button>
                            </form>

                            <p class="text-muted small" th:if="${#lists.isEmpty(panneaux[c.numero])}"
                               th:text="${c.nombre == 0} ? 'Aucun collaborateur dans cette case.' : 'Aucun collaborateur pour cette recherche.'">Aucun</p>
                            <div class="table-responsive" th:if="${not #lists.isEmpty(panneaux[c.numero])}">
                                <table class="table table-sm align-middle mb-0">
                                    <thead><tr><th>Collaborateur</th><th>Entité</th>
                                        <th class="text-end">Perf.</th><th class="text-end">Pot.</th></tr></thead>
                                    <tbody>
                                    <tr th:each="membre : ${panneaux[c.numero]}" class="neufbox-ligne"
                                        th:attr="data-nom=${membre.nomComplet},data-recherche=|${membre.nomComplet} ${membre.matricule} ${membre.entite}|,data-performance=${membre.performance},data-potentiel=${membre.potentiel}">
                                        <td><a th:href="${membre.lien}" th:text="${membre.nomComplet}">Prenom Nom</a>
                                            <span class="text-muted small d-block" th:text="${membre.matricule}">BP001</span></td>
                                        <td class="small" th:text="${membre.entite} ?: '-'">Agence</td>
                                        <td class="text-end" th:text="${membre.performance} ?: '-'">90</td>
                                        <td class="text-end" th:text="${membre.potentiel} ?: '-'">90</td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

</div>

<script th:if="${trimestre != null}" th:src="@{/js/neufbox.js}" defer></script>
</body>
</html>
