<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Talent 360 Bank - Viviers</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar('viviers')}"></div>

    <main class="main-content">
        <header class="page-header">
            <h1>Viviers de talents</h1>
            <p class="text-muted" th:if="${#lists.isEmpty(rows)}">Aucun employe rattache a un vivier pour le trimestre en cours.</p>
        </header>

        <div class="table-responsive" th:if="${not #lists.isEmpty(rows)}">
            <table class="table table-hover bg-white rounded shadow-sm">
                <thead>
                <tr>
                    <th>Nom</th>
                    <th>Prenom</th>
                    <th>Poste</th>
                    <th>Departement</th>
                    <th>Potentiel</th>
                    <th>Performance</th>
                    <th>Vivier</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${rows}">
                    <td th:text="${row.nom}"></td>
                    <td th:text="${row.prenom}"></td>
                    <td th:text="${row.poste}"></td>
                    <td th:text="${row.departement}"></td>
                    <td th:text="${row.potentiel}">-</td>
                    <td th:text="${row.performance}">-</td>
                    <td><span class="badge bg-primary" th:text="${row.categorieVivier}"></span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>

</div>

</body>
</html>
