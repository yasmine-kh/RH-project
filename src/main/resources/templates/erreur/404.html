<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>BP TALENT 360 — Page introuvable</title>
    <th:block th:replace="~{fragments/prototype :: tete}"></th:block>
</head>
<body>

<!--/* Page autonome (sans sidebar) : rendue par ProfilsAdvice pour une ressource introuvable. */-->
<main class="page-seule">
    <div class="boite" style="max-width:560px;">
        <div class="boite-tete marque"><span class="mark mark-logo"><img th:src="@{/images/BP-Logo-Complet.png}" alt="Banque Populaire" width="170" height="52"></span>
            <div><h3>BP TALENT 360</h3><p>Vivier &amp; Succession — SIRH</p></div></div>
        <div class="boite-corps">
            <h3 style="font-size:16px; margin-bottom:10px;">Page introuvable</h3>
            <p style="font-size:12.8px;">Ce que vous cherchez n'existe pas (ou plus) : matricule, entité ou trimestre inconnu.</p>
            <p style="font-size:12.8px; color:var(--muted);" th:if="${message != null}" th:text="${message}">Aucun collaborateur BP999</p>
            <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;">
                <a href="/" class="btn" style="text-decoration:none;">Tableau de bord RH</a>
                <a href="/collaborateurs" class="btn ghost" style="text-decoration:none;">Collaborateurs</a>
                <a href="/managers" class="btn ghost" style="text-decoration:none;">Managers</a>
                <a href="/entites" class="btn ghost" style="text-decoration:none;">Organigramme</a>
            </div>
            <!--/* Deconnexion, comme sur la page 403 et dans la barre laterale. */-->
            <form method="post" th:action="@{/logout}" sec:authorize="isAuthenticated()" style="margin-top:12px;" id="form-deconnexion">
                <button type="submit" class="btn ghost">Se déconnecter</button>
            </form>
        </div>
    </div>
</main>

</body>
</html>
