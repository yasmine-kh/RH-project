<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Talent 360 Bank - Acces refuse</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Version minimale, a restyler (Ima). -->
<main class="container" style="max-width: 560px; margin-top: 10vh;">
    <h1 class="h3 mb-3">Acces refuse</h1>
    <p>Votre profil ne permet pas d'ouvrir cette page.</p>
    <p class="text-muted" sec:authorize="isAuthenticated()">
        Connecte en tant que <strong sec:authentication="name">login</strong>.
    </p>

    <!-- Deconnexion en POST, avec le jeton CSRF ajoute par th:action. -->
    <form method="post" th:action="@{/logout}" sec:authorize="isAuthenticated()">
        <button type="submit" class="btn btn-outline-secondary">Se deconnecter</button>
    </form>
</main>

</body>
</html>
