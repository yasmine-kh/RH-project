<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>BP TALENT 360 — Notifications</title>
    <th:block th:replace="~{fragments/prototype :: tete}"></th:block>
</head>
<body>

<!--/*
  Notifications : balisage de renderNotifications() du prototype (un panneau, une ligne .notif-item par
  notification). Les notifications sont les alertes les plus graves du moteur (NotificationsViewService).
  Pas d'interrupteurs de preference : l'application, hors ligne, n'envoie aucune notification.
*/-->
<div id="app">
    <aside th:replace="~{fragments/prototype :: sidebar('notifications')}"></aside>

    <div id="main">
        <th:block th:with="sous=${vue != null} ? 'Alertes et rappels personnalisés — ' + ${vue.trimestreLibelle} : 'Alertes et rappels personnalisés'">
            <div th:replace="~{fragments/prototype :: topbar('Notifications', ${sous})}"></div>
        </th:block>

        <section class="view active" id="view-notifications">
            <th:block th:if="${trimestre == null}"><div th:replace="~{fragments/prototype :: aucunTrimestre}"></div></th:block>

            <form method="get" action="/notifications" class="filters" th:if="${trimestre != null}">
                <select th:replace="~{fragments/prototype :: choixTrimestre}"></select>
                <noscript><button type="submit" class="btn ghost">Afficher</button></noscript>
            </form>

            <th:block th:if="${vue != null}">
                <div class="alert warn" th:if="${vue.erreur != null}"><div class="sev">ATTENTION</div><div class="txt" th:text="${vue.erreur}">Reglages absents</div></div>
                <div class="alert info" th:each="information : ${vue.informations}"><div class="sev">INFO</div><div class="txt" th:text="${information}">Information</div></div>

                <div class="panel"><div class="panel-head"><h3>Notifications</h3>
                    <a class="hint" th:href="@{/alertes(trimestre=${trimestre.valeur})}">toutes les alertes</a></div><div class="panel-body">
                    <div class="notif-item" th:each="a, etat : ${vue.alertes}">
                        <div><span th:text="|${a.type.libelle} — ${a.sujet} : ${a.message}|">Poste critique sans successeur — Responsable Cybersecurite : Aucun successeur identifie</span>
                            <th:block th:if="${a.entiteCode != null}"> · <a th:href="@{/entites(code=${a.entiteCode}, trimestre=${trimestre.valeur})}" th:text="${a.entite}">Agence</a></th:block>
                            · <a th:href="${a.lien}" th:text="${a.lienLibelle}">Fiche collaborateur</a></div>
                    </div>
                    <div class="empty-state" th:if="${#lists.isEmpty(vue.alertes)}">Aucune notification.</div>
                </div></div>
            </th:block>
        </section>
    </div>
</div>

<div th:replace="~{fragments/prototype :: modal}"></div>
<script th:src="@{/js/prototype.js}"></script>
</body>
</html>
