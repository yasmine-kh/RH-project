<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>BP TALENT 360 — Postes critiques &amp; Succession</title>
    <th:block th:replace="~{fragments/prototype :: tete}"></th:block>
</head>
<body>

<!--
  Postes critiques & Succession : balisage de renderPostes() du prototype (.succ-card). Couverture et
  successeurs calcules par le moteur (PosteCritiqueViewService ; taux de couverture et postes en alerte
  lus sur la synthese du trimestre, API /api/dashboard/synthese).
-->
<div id="app">
    <aside th:replace="~{fragments/prototype :: sidebar('postes-critiques')}"></aside>

    <div id="main">
        <th:block th:with="sous=${trimestre != null} ? 'Couverture et profondeur de la relève — ' + ${trimestre.libelle} : 'Couverture et profondeur de la relève'">
            <div th:replace="~{fragments/prototype :: topbar('Postes critiques & Succession', ${sous})}"></div>
        </th:block>

        <section class="view active" id="view-postes">
            <th:block th:if="${trimestre == null}"><div th:replace="~{fragments/prototype :: aucunTrimestre}"></div></th:block>

            <form method="get" action="/postes-critiques" class="filters" th:if="${trimestre != null}">
                <select th:replace="~{fragments/prototype :: choixTrimestre}"></select>
                <noscript><button type="submit" class="btn ghost">Afficher</button></noscript>
            </form>

            <div class="empty-state" th:if="${trimestre != null and #lists.isEmpty(rows)}">Aucun poste critique pour le trimestre en cours.</div>

            <div class="panel" th:if="${not #lists.isEmpty(rows)}" th:attr="data-synthese-trimestre=${trimestre.valeur}" hidden><div class="panel-body">
                <div style="display:flex; justify-content:space-between; align-items:center;"><div><b data-synthese="nbAlertesPostesCritiques">1</b>
                    poste(s) critique(s) en alerte sur <b data-synthese="nbPostesCritiques">15</b> — taux de couverture de la succession</div>
                    <div class="mono"><span data-synthese="tauxCouverture">93.33</span> %</div></div>
                <div class="cov-bar"><div class="cov-bar-fill" data-synthese-largeur="tauxCouverture" style="width:0%"></div></div>
            </div></div>

            <div class="succ-card" th:each="p : ${rows}" th:id="|poste-${p.posteId}|"><div class="sh">
                <div><div class="t" th:text="${p.nomPoste}">Directeur regional</div>
                    <div class="d" th:text="|${p.posteId} · ${p.direction} · criticité : ${p.criticite ?: '—'} · titulaire : ${p.titulaire ?: '—'}|">PST01 · Reseau Retail</div></div>
                <span class="statut-tag" th:text="${p.statut}" th:style="${p.enAlerte} ? 'color:var(--rust); border-color:var(--rust); background:var(--rust-light)' : ''">Couverte - Ready Now</span></div>
                <div class="sb">
                    <div class="succ-row" th:each="s : ${p.successeurs}" th:attr="data-href=@{/fiche-collaborateur(matricule=${s.matricule}, trimestre=${trimestre.valeur})}"
                         style="cursor:pointer"><span class="m" th:text="${s.matricule}">BP035</span><span class="nm"><a
                            th:href="@{/fiche-collaborateur(matricule=${s.matricule}, trimestre=${trimestre.valeur})}" th:text="${s.nomComplet}">Nom</a></span><th:block
                            th:replace="~{fragments/prototype :: readiness(${s.readiness}, ${s.readinessLibelle})}"></th:block><span class="statut-tag"
                            th:text="${s.gapCompetence != null} ? |Plus grand gap : ${s.gapCompetence} (${s.gapNiveaux})| : 'Aucun écart'">Aucun écart</span><span
                            class="pct" th:text="|${s.scoreMatching}%|">95.20%</span></div>
                    <div class="no-succ" th:if="${#lists.isEmpty(p.successeurs)}">🔴 Aucun successeur identifié — poste sans relève.</div>
                </div>
            </div>
        </section>
    </div>
</div>

<div th:replace="~{fragments/prototype :: modal}"></div>
<script th:src="@{/js/prototype.js}"></script>
</body>
</html>
