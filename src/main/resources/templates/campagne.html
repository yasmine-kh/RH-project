<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Talent 360 Bank - Campagne</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar('campagne')}"></div>

    <main class="main-content">
        <header class="page-header">
            <h1>Campagne d'évaluation</h1>
            <p class="text-muted" th:if="${vue != null}"
               th:text="|Évaluations du manager (performance et potentiel) - ${vue.trimestre.libelle}|">T3 2026</p>
        </header>

        <th:block th:if="${trimestre == null}"><div th:replace="~{fragments/commun :: aucunTrimestre}"></div></th:block>

        <form method="get" action="/campagne" class="filtre-bar" th:if="${trimestre != null}">
            <div th:replace="~{fragments/commun :: choixTrimestre}"></div>
            <button type="submit" class="btn btn-primary"><i class="bi bi-funnel"></i> Afficher</button>
        </form>

        <div class="alert alert-warning mt-4" th:if="${erreur != null}" th:text="${erreur}">Entite inconnue</div>

        <th:block th:if="${vue != null}">
            <nav class="mt-3 small" aria-label="Niveau">
                <a th:href="@{/campagne(trimestre=${trimestre.valeur})}">Toute la banque</a>
                <span th:if="${vue.entite != null}" th:text="| / ${vue.entite.libelle}|"> / Reseau Retail</span>
            </nav>

            <div class="card shadow-sm mt-3">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <strong th:text="${vue.total.libelle}">Toute la banque</strong>
                        <span th:text="|${vue.total.nbEvalues} / ${vue.total.nbActifs} évalués (${vue.total.pourcentageEvalues ?: 0} %)|">100 / 100</span>
                    </div>
                    <div class="progress mt-2" style="height: 10px">
                        <div class="progress-bar bg-success" role="progressbar"
                             th:style="|width: ${vue.total.pourcentageEvalues ?: 0}%|"></div>
                    </div>
                    <p class="small text-muted mt-2 mb-0"
                       th:text="|${vue.total.nbManquants} évaluation(s) manquante(s), ${vue.total.nbAutoEvaluations} auto-évaluation(s)|">0 manquante</p>
                </div>
            </div>

            <div class="alert alert-light border mt-3 small" th:if="${not #lists.isEmpty(vue.remarques)}">
                <div th:each="remarque : ${vue.remarques}"><i class="bi bi-info-circle"></i>
                    <span th:text="${remarque}">Remarque</span></div>
            </div>

            <div class="table-responsive mt-3" th:if="${not #lists.isEmpty(vue.lignes)}">
                <table class="table table-hover bg-white rounded shadow-sm align-middle">
                    <thead>
                    <tr>
                        <th>Entité</th><th class="text-end">Actifs</th><th class="text-end">Évalués</th>
                        <th style="min-width: 160px">Avancement</th><th class="text-end">Manquants</th>
                        <th>Managers en retard</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="ligne : ${vue.lignes}">
                        <td>
                            <a th:if="${ligne.code != null and (vue.entite == null or ligne.code != vue.entite.code)}"
                               th:href="@{/campagne(trimestre=${trimestre.valeur}, entite=${ligne.code})}"
                               th:text="${ligne.libelle}">Reseau Retail</a>
                            <span th:unless="${ligne.code != null and (vue.entite == null or ligne.code != vue.entite.code)}"
                                  th:text="${ligne.libelle}">Sans direction</span>
                        </td>
                        <td class="text-end" th:text="${ligne.nbActifs}">47</td>
                        <td class="text-end" th:text="${ligne.nbEvalues}">47</td>
                        <td>
                            <div class="progress" style="height: 8px">
                                <div class="progress-bar" role="progressbar"
                                     th:classappend="${ligne.nbManquants == 0} ? 'bg-success' : 'bg-warning'"
                                     th:style="|width: ${ligne.pourcentageEvalues ?: 0}%|"></div>
                            </div>
                            <span class="small text-muted" th:text="|${ligne.pourcentageEvalues ?: 0} %|">100 %</span>
                        </td>
                        <td class="text-end" th:text="${ligne.nbManquants}">0</td>
                        <td>
                            <span class="text-muted" th:if="${#lists.isEmpty(ligne.managers)}">-</span>
                            <div class="small" th:each="manager : ${ligne.managers}">
                                <a th:if="${manager.matricule != null}"
                                   th:href="@{/fiche-collaborateur(matricule=${manager.matricule}, trimestre=${trimestre.valeur})}"
                                   th:text="${manager.nom}">Manager</a>
                                <span th:if="${manager.matricule == null}" th:text="${manager.nom}">Sans manager</span>
                                <span th:text="|: ${manager.nbManquants}|">: 2</span>
                                (<th:block th:each="matricule, etat : ${manager.manquants}"><a
                                    th:href="@{/fiche-collaborateur(matricule=${matricule}, trimestre=${trimestre.valeur})}"
                                    th:text="${matricule}">BP001</a><span th:if="${!etat.last}">, </span></th:block>)
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </th:block>
    </main>

</div>

<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
