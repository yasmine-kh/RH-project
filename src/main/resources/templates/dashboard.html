<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Talent 360 Bank - Dashboard</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar('accueil')}"></div>

    <main class="main-content">
        <header class="page-header">
            <h1>Dashboard general</h1>
            <p class="text-muted">Vue d'ensemble - donnees mockees, en attente de CalculService / AlerteService</p>
        </header>

        <div class="kpi-grid">
            <div class="kpi-card" th:each="kpi : ${kpis}" th:classappend="${kpi.colorClass}">
                <div class="kpi-icon"><i th:class="'bi ' + ${kpi.icon}"></i></div>
                <div class="kpi-body">
                    <div class="kpi-value" th:text="${kpi.value}">0</div>
                    <div class="kpi-label" th:text="${kpi.label}">Libelle</div>
                </div>
            </div>
        </div>
    </main>

</div>

</body>
</html>
