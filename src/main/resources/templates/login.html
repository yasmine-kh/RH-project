<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>BP TALENT 360 — Connexion</title>
    <th:block th:replace="~{fragments/prototype :: tete}"></th:block>
</head>
<body>

<!--/* Connexion, aux couleurs du prototype. Le formulaire est traite par Spring Security (POST /login). */-->
<main class="page-seule">
    <div class="boite">
        <div class="boite-tete marque">
            <!--/* Logo BP complet dans la case de la marque (bordure doree, elargie aux proportions du logo). */-->
            <span class="mark mark-logo"><img th:src="@{/images/BP-Logo-Complet.png}" alt="Banque Populaire" width="170" height="52"></span>
            <div><h3>BP TALENT 360</h3><p>Vivier &amp; Succession — SIRH</p></div>
        </div>
        <div class="boite-corps">
            <div class="alert crit" th:if="${param.error}"><div class="sev">ERREUR</div><div class="txt">Identifiant ou mot de passe incorrect.</div></div>
            <div class="alert info" th:if="${param.deconnexion}"><div class="sev">INFO</div><div class="txt">Vous etes deconnecte.</div></div>

            <!--/* th:action ajoute le champ cache du jeton CSRF. */-->
            <form method="post" th:action="@{/login}">
                <div class="form-row"><label for="username">Identifiant</label>
                    <input type="text" id="username" name="username" autocomplete="username" required autofocus></div>
                <div class="form-row"><label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required></div>
                <button type="submit" class="btn" style="width:100%; margin-top:6px;">Se connecter</button>
            </form>
        </div>
    </div>
</main>

</body>
</html>
