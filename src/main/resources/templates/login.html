<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Talent 360 Bank - Connexion</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Version minimale, a restyler (Ima). Le formulaire est traite par Spring Security (POST /login). -->
<main class="container" style="max-width: 420px; margin-top: 10vh;">
    <h1 class="h3 mb-4">Talent 360 Bank</h1>

    <div class="alert alert-danger" th:if="${param.error}">Identifiant ou mot de passe incorrect.</div>
    <div class="alert alert-info" th:if="${param.deconnexion}">Vous etes deconnecte.</div>

    <!-- th:action ajoute le champ cache du jeton CSRF. -->
    <form method="post" th:action="@{/login}">
        <div class="mb-3">
            <label for="username" class="form-label">Identifiant</label>
            <input type="text" id="username" name="username" class="form-control"
                   autocomplete="username" required autofocus>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Mot de passe</label>
            <input type="password" id="password" name="password" class="form-control"
                   autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Se connecter</button>
    </form>
</main>

</body>
</html>
