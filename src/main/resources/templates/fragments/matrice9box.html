<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Matrice 9-Box commune (page 9-Box, accueil, dashboard DG, vue manager, vue entite). Parametre m = MatriceNeufBox.
  Potentiel en X (faible a gauche -> eleve a droite), Performance en Y (faible en bas -> elevee en haut) :
  case 9 "Talent cle" en haut a droite, case 1 en bas a gauche. Les cases arrivent deja dans cet ordre.
  Jamais de noms dans les cases : chaque case entiere est un lien (detail sur la page 9-Box, liste ailleurs).
-->
<div th:fragment="matrice(m)" class="matrice9-bloc">
    <div class="matrice9">
        <div class="matrice9-titre-y"><span>Performance &rarr;</span></div>
        <div class="matrice9-grille">
            <th:block th:each="c, etat : ${m.cases}">
                <div class="matrice9-niveau-y" th:if="${etat.index % 3 == 0}"
                     th:text="${c.niveauPerformance == 3} ? 'Élevée' : (${c.niveauPerformance == 2} ? 'Moyenne' : 'Faible')">Elevee</div>
                <a class="matrice9-case"
                   th:classappend="|${c.numero == 9 ? 'matrice9-talent-cle' : ''} ${m.caseSelectionnee != null and c.numero == m.caseSelectionnee ? 'matrice9-selectionnee' : ''}|"
                   th:href="${c.lien}"
                   th:attr="data-case=${c.numero},aria-current=${m.caseSelectionnee != null and c.numero == m.caseSelectionnee} ? 'true' : null"
                   th:title="|${c.libelle} : ${c.nombre} collaborateur(s)|">
                    <span class="matrice9-entete">
                        <span class="matrice9-numero" th:text="${c.numero}">9</span>
                        <span class="matrice9-libelle" th:text="${c.libelle}">Talent cle</span>
                    </span>
                    <span class="matrice9-compte" th:text="${c.nombre}">10</span>
                    <span class="matrice9-part" th:text="${c.pourcentage != null} ? |${c.pourcentage} %| : '-'">10.0 %</span>
                </a>
            </th:block>
            <div></div>
            <div class="matrice9-niveau-x">Faible</div>
            <div class="matrice9-niveau-x">Moyen</div>
            <div class="matrice9-niveau-x">Élevé</div>
        </div>
    </div>
    <div class="matrice9-titre-x">Potentiel &rarr;</div>

    <div class="matrice9-legende small text-muted">
        <span><span class="matrice9-pastille matrice9-talent-cle"></span>Talent clé (performance et potentiel élevés)</span>
        <span>Cliquer sur une case pour voir ses collaborateurs</span>
        <span class="matrice9-total"
              th:text="|Total : ${m.total} collaborateur(s) placé(s)| + (${m.nbNonPlaces} > 0 ? |, ${m.nbNonPlaces} non placé(s)| : '')">Total : 100</span>
    </div>
</div>

</body>
</html>
