<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Fragment reutilisable de la sidebar.
  Parametre "active" = identifiant de la page en cours (voir activePage
  envoye par PagesController) pour surligner le bon lien.
-->
<div th:fragment="sidebar(active)" class="sidebar">
    <div class="sidebar-brand">
        <span class="brand-icon">🏦</span>
        <span class="brand-text">Talent 360 Bank</span>
    </div>

    <!--
      Selecteur de profil : des vues que le RH ouvre, pas des connexions (un seul compte RH).
      Options lues une fois par requete (ProfilsAdvice). Sans JavaScript, le formulaire marche
      tel quel (bouton Ouvrir) ; profil.js masque le second champ pour RH / Comite et choisit sa liste.
    -->
    <form th:if="${profils != null}" method="get" action="/profil" class="sidebar-profil" id="profil-form"
          th:with="courant=${active == 'fiche-collaborateur'} ? 'COLLABORATEUR'
                  : (${active == 'vue-manager' or active == 'managers'} ? 'MANAGER'
                  : (${active == 'vue-entite' or active == 'entites'} ? 'ENTITE'
                  : (${active == 'comite-talent'} ? 'COMITE' : 'RH')))">
        <input type="hidden" name="trimestre" th:if="${trimestre != null}" th:value="${trimestre.valeur}">
        <label for="profil-type" class="sidebar-profil-label">Profil</label>
        <select id="profil-type" name="profil" class="form-select form-select-sm">
            <option th:each="type : ${profils.types()}"
                    th:value="${type.valeur}" th:text="${type.libelle}"
                    th:selected="${type.valeur == courant}">RH</option>
        </select>
        <div class="sidebar-profil-cible" id="profil-cible-bloc">
            <input type="search" id="profil-cible" name="cible" class="form-control form-control-sm mt-2"
                   autocomplete="off" placeholder="Matricule, nom ou entité"
                   th:value="${courant != 'RH' and courant != 'COMITE'} ? ${profilCible} : ''"
                   th:attr="list=${courant == 'MANAGER'} ? 'profils-managers'
                           : (${courant == 'ENTITE'} ? 'profils-entites' : 'profils-collaborateurs')">
            <button type="submit" class="btn btn-sm btn-light mt-2 w-100">Ouvrir</button>
        </div>
        <datalist id="profils-collaborateurs">
            <option th:each="choix : ${profils.collaborateurs}" th:value="${choix.valeur}" th:label="${choix.libelle}"
                    th:text="${choix.libelle}">Nom</option>
        </datalist>
        <datalist id="profils-managers">
            <option th:each="choix : ${profils.managers}" th:value="${choix.valeur}" th:label="${choix.libelle}"
                    th:text="${choix.libelle}">Nom</option>
        </datalist>
        <datalist id="profils-entites">
            <option th:each="choix : ${profils.entites}" th:value="${choix.valeur}" th:label="${choix.libelle}"
                    th:text="${choix.libelle}">Entite</option>
        </datalist>
    </form>
    <script th:if="${profils != null}" th:src="@{/js/profil.js}" defer></script>

    <nav class="sidebar-nav">
        <a href="/" class="nav-item" th:classappend="${active == 'accueil'} ? 'active'">
            <i class="bi bi-house"></i><span>Accueil</span>
        </a>
        <a href="/dashboard-dg" class="nav-item" th:classappend="${active == 'dashboard-dg'} ? 'active'">
            <i class="bi bi-speedometer2"></i><span>Dashboard DG</span>
        </a>
        <a href="/collaborateurs" class="nav-item" th:classappend="${active == 'collaborateurs'} ? 'active'">
            <i class="bi bi-person-lines-fill"></i><span>Collaborateurs</span>
        </a>
        <a href="/9box" class="nav-item" th:classappend="${active == '9box'} ? 'active'">
            <i class="bi bi-grid-3x3"></i><span>9-Box</span>
        </a>
        <a href="/viviers" class="nav-item" th:classappend="${active == 'viviers'} ? 'active'">
            <i class="bi bi-people"></i><span>Viviers</span>
        </a>
        <a href="/postes-critiques" class="nav-item" th:classappend="${active == 'postes-critiques'} ? 'active'">
            <i class="bi bi-exclamation-triangle"></i><span>Postes critiques</span>
        </a>
        <a href="/competences" class="nav-item" th:classappend="${active == 'competences'} ? 'active'">
            <i class="bi bi-mortarboard"></i><span>Compétences</span>
        </a>
        <a href="/comite-talent" class="nav-item" th:classappend="${active == 'comite-talent'} ? 'active'">
            <i class="bi bi-person-badge"></i><span>Comite Talent</span>
        </a>
        <a href="/fiche-collaborateur" class="nav-item" th:classappend="${active == 'fiche-collaborateur'} ? 'active'">
            <i class="bi bi-person-vcard"></i><span>Fiche collaborateur</span>
        </a>
        <a href="/alertes" class="nav-item" th:classappend="${active == 'alertes'} ? 'active'">
            <i class="bi bi-bell"></i><span>Alertes</span>
        </a>
        <a href="/notifications" class="nav-item" th:classappend="${active == 'notifications'} ? 'active'">
            <i class="bi bi-envelope"></i><span>Notifications</span>
        </a>
        <a href="/campagne" class="nav-item" th:classappend="${active == 'campagne'} ? 'active'">
            <i class="bi bi-clipboard-check"></i><span>Campagne</span>
        </a>
        <a href="/import" class="nav-item" th:classappend="${active == 'import'} ? 'active'">
            <i class="bi bi-upload"></i><span>Import</span>
        </a>
        <a href="/parametres" class="nav-item" th:classappend="${active == 'parametres'} ? 'active'">
            <i class="bi bi-gear"></i><span>Parametres</span>
        </a>
    </nav>
</div>

</body>
</html>
