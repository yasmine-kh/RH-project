<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Fragments communs aux ecrans par trimestre.
  - aucunTrimestre : etat vide quand aucun trimestre n'existe encore, avec le lien vers l'import.
  - choixTrimestre : la liste deroulante du trimestre, a placer dans le formulaire de filtres
    de l'ecran (attributs "trimestre" et "trimestres" poses par TrimestreCourantService).
-->

<div th:fragment="aucunTrimestre" class="placeholder-box mt-4">
    <i class="bi bi-inbox"></i>
    <p class="mb-2">Aucun trimestre importé pour le moment : il n'y a encore rien à afficher.</p>
    <a href="/import" class="btn btn-primary"><i class="bi bi-upload"></i> Importer le classeur</a>
</div>

<div th:fragment="choixTrimestre">
    <label for="trimestre" class="form-label">Trimestre</label>
    <select id="trimestre" name="trimestre" class="form-select">
        <option th:each="option : ${trimestres}" th:value="${option.valeur}"
                th:text="${option.hasData} ? ${option.libelle} : ${option.libelle} + ' (pas encore calcule)'"
                th:selected="${trimestre != null and option.valeur == trimestre.valeur}">T3 2026</option>
    </select>
</div>

</body>
</html>
