<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Talent 360 Bank - Comite Talent</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar('comite-talent')}"></div>

    <main class="main-content">
        <header class="page-header">
            <h1>Comite Talent</h1>
            <p class="text-muted" th:if="${vue.trimestreLibelle == null}">Aucun trimestre enregistre pour le moment.</p>
            <p class="text-muted" th:if="${vue.trimestreLibelle != null}"
               th:text="'Talents proposes par le moteur et decision du comite - ' + ${vue.trimestreLibelle}">
                Talents proposes par le moteur et decision du comite</p>
        </header>

        <form method="get" action="/comite-talent" class="filtre-bar" th:if="${vue.trimestreLibelle != null}">
            <div>
                <label for="trimestre" class="form-label">Trimestre</label>
                <select id="trimestre" name="trimestre" class="form-select">
                    <option th:each="option : ${vue.trimestres}" th:value="${option.valeur}"
                            th:text="${option.libelle}" th:selected="${option.selectionnee}">T3 2026</option>
                </select>
            </div>
            <div>
                <label for="statut" class="form-label">Statut comite</label>
                <select id="statut" name="statut" class="form-select">
                    <option th:each="option : ${vue.statuts}" th:value="${option.valeur}"
                            th:text="${option.libelle}" th:selected="${option.selectionnee}">Tous</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary"><i class="bi bi-funnel"></i> Afficher</button>
        </form>

        <div class="kpi-grid" th:if="${vue.trimestreLibelle != null}">
            <div class="kpi-card" th:each="kpi : ${vue.kpis}" th:classappend="${kpi.colorClass}">
                <div class="kpi-icon"><i th:class="'bi ' + ${kpi.icon}"></i></div>
                <div class="kpi-body">
                    <div class="kpi-value" th:text="${kpi.value}">0</div>
                    <div class="kpi-label" th:text="${kpi.label}">Libelle</div>
                </div>
            </div>
        </div>

        <div class="alert alert-warning mt-4" th:if="${vue.erreur != null}" th:text="${vue.erreur}">Reglages absents</div>

        <p class="text-muted mt-4"
           th:if="${vue.trimestreLibelle != null and vue.erreur == null and vue.nbProposes == 0}">
            Aucun talent propose par le moteur pour ce trimestre.</p>
        <p class="text-muted mt-4"
           th:if="${vue.nbProposes > 0 and #lists.isEmpty(vue.rows)}">
            Aucun talent pour ce statut.</p>

        <div class="table-responsive mt-4" th:if="${not #lists.isEmpty(vue.rows)}">
            <table class="table table-hover bg-white rounded shadow-sm">
                <thead>
                <tr>
                    <th>Nom</th>
                    <th>Direction</th>
                    <th>Performance</th>
                    <th>Potentiel</th>
                    <th>Case 9-Box</th>
                    <th>Statut comite</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${vue.rows}">
                    <td th:text="${row.nomComplet}"></td>
                    <td th:text="${row.direction}"></td>
                    <td>
                        <span th:text="${row.performance} ?: '-'">-</span>
                        <span class="score-categorie" th:if="${row.categoriePerformance != null}"
                              th:text="${row.categoriePerformance}"></span>
                    </td>
                    <td>
                        <span th:text="${row.potentiel} ?: '-'">-</span>
                        <span class="score-categorie" th:if="${row.categoriePotentiel != null}"
                              th:text="${row.categoriePotentiel}"></span>
                    </td>
                    <td th:text="${row.positionBox} ?: '-'">-</td>
                    <td><span class="badge" th:classappend="${row.badgeClass}" th:text="${row.statutLibelle}"></span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>

</div>

</body>
</html>
