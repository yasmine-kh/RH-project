<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>BP TALENT 360 — Managers</title>
    <th:block th:replace="~{fragments/prototype :: tete}"></th:block>
</head>
<body>

<!-- Managers (page propre a l'application) : la liste des managers, chacun vers la vue de son equipe. -->
<div id="app">
    <aside th:replace="~{fragments/prototype :: sidebar('managers')}"></aside>

    <div id="main">
        <th:block th:with="sous=${managers != null} ? ${#lists.size(managers)} + ' manager(s) - choisir une équipe' : 'Choisir une équipe'">
            <div th:replace="~{fragments/prototype :: topbar('Managers', ${sous})}"></div>
        </th:block>

        <section class="view active" id="view-managers">
            <th:block th:if="${trimestre == null}"><div th:replace="~{fragments/prototype :: aucunTrimestre}"></div></th:block>

            <div class="panel" th:if="${managers != null and not #lists.isEmpty(managers)}"><div class="panel-body" style="padding-top:6px;">
                <table><thead><tr><th>Matricule</th><th>Manager</th><th>Fonction</th><th>Entité</th><th>Équipe directe</th></tr></thead>
                <tbody><tr th:each="manager : ${managers}" th:attr="data-href=@{/managers/{matricule}(matricule=${manager.matricule}, trimestre=${trimestre.valeur})}">
                    <td class="mono" th:text="${manager.matricule}">BP026</td>
                    <td><a th:href="@{/managers/{matricule}(matricule=${manager.matricule}, trimestre=${trimestre.valeur})}"
                           th:text="|${manager.prenom} ${manager.nom}|">Manager</a></td>
                    <td th:text="${manager.fonction} ?: '—'">Fonction</td>
                    <td><a th:if="${manager.entite != null}" th:href="@{/entites(code=${manager.entite.code}, trimestre=${trimestre.valeur})}"
                           th:text="${manager.entite.libelle}">Agence</a><th:block th:if="${manager.entite == null}">—</th:block></td>
                    <td class="mono" th:text="${manager.tailleEquipe}">5</td>
                </tr></tbody></table>
            </div></div>
        </section>
    </div>
</div>

<div th:replace="~{fragments/prototype :: modal}"></div>
<script th:src="@{/js/prototype.js}"></script>
</body>
</html>
