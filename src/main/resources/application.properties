spring.application.name=talent360bank

# Application monoposte : n'ecoute que sur la machine locale, jamais sur le reseau.
server.address=127.0.0.1
server.port=8080

# connectTimeout : echec rapide si MySQL ne repond pas.
# lock_wait_timeout : une mise a jour du schema bloquee par un verrou echoue au
# bout de 60 s au lieu d'attendre (defaut MySQL : un an).
spring.datasource.url=jdbc:mysql://localhost:3306/talent360bank?connectTimeout=5000&sessionVariables=lock_wait_timeout=60
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Attente maximale d'une connexion du pool (defaut : 30 s).
spring.datasource.hikari.connection-timeout=10000

spring.jpa.hibernate.ddl-auto=update

# DevTools : desactive hors profil dev (voir application-dev.properties).
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
