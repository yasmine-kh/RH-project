spring.application.name=talent360bank

# Application monoposte : n'ecoute que sur la machine locale, jamais sur le reseau.
server.address=127.0.0.1
server.port=8080

# connectTimeout : echec rapide si MySQL ne repond pas.
# lock_wait_timeout : une mise a jour du schema bloquee par un verrou echoue au
# bout de 60 s au lieu d'attendre (defaut MySQL : un an).
spring.datasource.url=jdbc:mysql://localhost:3306/talent360bank?connectTimeout=5000&sessionVariables=lock_wait_timeout=60
# Compte MySQL dedie (jamais root), lu dans les variables d'environnement, sans
# valeur par defaut : sans elles, l'application refuse de demarrer.
# Voir docs/guide-developpeur.md, section "Accounts and environment variables".
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Attente maximale d'une connexion du pool (defaut : 30 s).
spring.datasource.hikari.connection-timeout=10000

spring.jpa.hibernate.ddl-auto=update

# Session (connexion par formulaire, voir config/SecurityConfig) : poste partage
# par plusieurs profils, donc session courte. Cookie inaccessible au JavaScript
# (HttpOnly) et jamais envoye depuis un autre site (SameSite=Strict). Pas de
# jsessionid dans les URL. Pas de "secure" : l'application est servie en HTTP
# sur 127.0.0.1.
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.tracking-modes=cookie

# Import du classeur (POST /api/imports) : le jeu de donnees fait ~300 Ko,
# la limite par defaut de Spring (1 Mo) serait vite atteinte par un classeur reel.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# DevTools : desactive hors profil dev (voir application-dev.properties).
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
